[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketelite-backend"
version = "0.1.0"
description = "MarketElite Backend - US Equity Multi-Agent Risk & Market Structure Workstation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "psycopg-pool>=3.2.0,<4.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "alembic>=1.13.3,<2.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "redis>=5.2.0,<6.0.0",
    "arq>=0.26.1,<1.0.0",
    "httpx>=0.27.2,<1.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "numpy>=1.26.0,<3.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "mcp>=1.6.0,<2.0.0",
    "langchain-core>=0.3.30,<1.0.0",
    "langchain-openai>=0.2.14,<1.0.0",
    "langgraph>=0.2.60,<1.0.0",
    "langchain-mcp-adapters>=0.1.10,<0.2.0",
    "opentelemetry-sdk>=1.30.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0,<2.0.0",
    "openinference-instrumentation-langchain>=0.1.30,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.7.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
