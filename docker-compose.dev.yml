services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marketelite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketelite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketelite_dev}
      POSTGRES_DB: ${POSTGRES_DB:-marketelite}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketelite} -d ${POSTGRES_DB:-marketelite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: marketelite-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: marketelite-phoenix
    restart: unless-stopped
    ports:
      - "6007:6006"
      - "4318:4317"
    volumes:
      - phoenix_data:/mnt/data
    environment:
      PHOENIX_WORKING_DIR: /mnt/data

  frontend:
    profiles: ["web"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8100}
    container_name: marketelite-frontend
    restart: unless-stopped
    ports:
      - "3100:3000"

volumes:
  postgres_data:
  redis_data:
  phoenix_data:
